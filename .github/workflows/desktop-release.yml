name: Desktop release

# Builds the Windows, macOS and Linux installers. Pushing a tag like v1.0.1 also publishes them as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageMsi
            dir: msi
            asset: Metrolist-PC-Windows.msi
          - os: macos-latest
            task: packageDmg
            dir: dmg
            asset: Metrolist-PC-macOS.dmg
          - os: ubuntu-latest
            task: packageDeb
            dir: deb
            asset: Metrolist-PC-Linux.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installer
        run: |
          VERSION=1.0.0
          # Installers need a plain x.y.z: v1.4.0-exp.1 builds as 1.4.0.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="${GITHUB_REF_NAME#v}"; VERSION="${VERSION%%-*}"; fi
          ./gradlew ${{ matrix.task }} -PappVersion="$VERSION" --no-configuration-cache
          mkdir -p dist
          cp build/compose/binaries/main/${{ matrix.dir }}/* "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: desktop/dist/${{ matrix.asset }}

  release:
    needs: build
    # Publish whatever built: hosted macOS runners are sometimes unavailable, and a re-run adds the missing file.
    if: always() && github.ref_type == 'tag' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A re-run (after macOS runners were unavailable) only adds the missing files.
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" dist/* --clobber; exit 0; fi
          BASE="https://github.com/$GH_REPO/releases/download/$TAG"
          cat > notes.md <<EOF
          ## Download
          | Windows | macOS | Linux |
          | --- | --- | --- |
          | [Metrolist-PC-Windows.msi]($BASE/Metrolist-PC-Windows.msi) | [Metrolist-PC-macOS.dmg]($BASE/Metrolist-PC-macOS.dmg) | [Metrolist-PC-Linux.deb]($BASE/Metrolist-PC-Linux.deb) |

          The installers are not code-signed: Windows SmartScreen may show "Windows protected your PC" (click **More info → Run anyway**), and on macOS right-click the app and choose **Open** the first time.
          EOF
          # A tag with a suffix (v1.4.0-exp.1) is a prerelease, which the in-app updater never offers.
          PRE=""; [[ "$TAG" == *-* ]] && PRE="--prerelease"
          gh release create "$TAG" dist/* --title "Metrolist PC $TAG" --generate-notes --notes-file notes.md $PRE
